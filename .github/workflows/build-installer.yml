name: Build DevAtServGUI packages

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      msb_ref:
        description: 'Ref of the MicroserviceBase repo to build the bundled wheel from'
        default: 'develop'

permissions:
  contents: read

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for metadata validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate application package and runtime versions
        id: check
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          python_project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          python_lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          source = python_project["tool"]["uv"]["sources"]["MicroserviceBase"]
          if source.get("git") != "https://github.com/test-fullautomation/microservice-base.git":
              raise SystemExit("MicroserviceBase must come from the declared GitHub repository")
          if not re.fullmatch(r"[0-9a-f]{40}", source.get("rev", "")):
              raise SystemExit("MicroserviceBase must be pinned to a full commit")
          msb = next(item for item in python_lock["package"] if item["name"] == "microservicebase")
          if not msb["source"].get("git", "").endswith("#" + source["rev"]):
              raise SystemExit("uv.lock does not match the pinned MicroserviceBase commit")
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          module = ast.parse(Path("MODULE.bazel").read_text(encoding="utf-8"))
          declaration = next(
              node.value
              for node in module.body
              if isinstance(node, ast.Expr)
              and isinstance(node.value, ast.Call)
              and isinstance(node.value.func, ast.Name)
              and node.value.func.id == "module"
          )
          module_version = next(
              ast.literal_eval(keyword.value)
              for keyword in declaration.keywords
              if keyword.arg == "version"
          )
          versions = {
              "package.json": package["version"],
              "package-lock.json": lock["version"],
              "package-lock.json root package": lock["packages"][""]["version"],
              "MODULE.bazel": module_version,
              "pyproject.toml": python_project["project"]["version"],
          }
          for source, version in versions.items():
              print(f"{source}: {version}")
          version = package["version"]
          if not version or any(value != version for value in versions.values()):
              raise SystemExit("Application package and runtime versions must agree")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

  build:
    name: Build ${{ matrix.name }} installer and portable
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            installer_file: DevAtServGUI-installer-x64.exe
            portable_file: DevAtServGUI-portable-x64.exe
          - os: ubuntu-22.04
            name: linux
            installer_file: DevAtServGUI-installer-x64.deb
            portable_file: DevAtServGUI-portable-x64.AppImage

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: '1'
      INSTALLER_FILE: ${{ matrix.installer_file }}
      PORTABLE_FILE: ${{ matrix.portable_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.name }}
          repository-cache: true

      - name: Install Linux packaging tools
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm xvfb

      - name: Build installer and portable with Bazel
        run: bazel build //:installer //:portable --verbose_failures

      - name: Smoke-test Windows portable backend
        if: matrix.name == 'windows'
        shell: powershell
        timeout-minutes: 5
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE "bazel-bin/$env:PORTABLE_FILE"
          $process = Start-Process -FilePath $app -ArgumentList '--runtime-smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Portable Python backend smoke test failed: $($process.ExitCode)"
          }

      - name: Smoke-test Linux portable backend
        if: matrix.name == 'linux'
        timeout-minutes: 5
        run: |
          chmod +x "bazel-bin/$PORTABLE_FILE"
          xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "bazel-bin/$PORTABLE_FILE" --runtime-smoke-test --no-sandbox

      - name: Verify package outputs
        run: |
          for file in "$INSTALLER_FILE" "$PORTABLE_FILE"; do
            if [[ ! -s "bazel-bin/$file" ]]; then
              echo "::error::Missing or empty package: bazel-bin/$file"
              exit 1
            fi
          done

      - name: Upload ${{ matrix.name }} installer
        uses: actions/upload-artifact@v4
        with:
          name: DevAtServGUI-${{ matrix.name }}-installer-${{ needs.version-check.outputs.version }}
          path: bazel-bin/${{ matrix.installer_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload ${{ matrix.name }} portable
        uses: actions/upload-artifact@v4
        with:
          name: DevAtServGUI-${{ matrix.name }}-portable-${{ needs.version-check.outputs.version }}
          path: bazel-bin/${{ matrix.portable_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        env:
          PACKAGE_VERSION: ${{ needs.version-check.outputs.version }}
          PLATFORM_NAME: ${{ matrix.name }}
        run: |
          {
            printf '## %s packages\n\n' "$PLATFORM_NAME"
            printf '| File | Size |\n|---|---|\n'
            for file in "$INSTALLER_FILE" "$PORTABLE_FILE"; do
              printf '| `%s` | %s |\n' "$file" "$(du -h "bazel-bin/$file" | cut -f1)"
            done
            printf '\nVersion `%s`, commit `%s`\n' "$PACKAGE_VERSION" "${GITHUB_SHA:0:8}"
          } >> "$GITHUB_STEP_SUMMARY"
