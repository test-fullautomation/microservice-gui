[project]
name = "devatservgui-runtime"
version = "2.2.0"
requires-python = "==3.12.*"
dependencies = [
    "MicroserviceBase[web]==3.0.0",
    "microservice-gui-bridge==1.0.0",
    "pika>=1.3.2,<2",
    "websockets>=13.0",
]

[tool.uv]
package = false
build-constraint-dependencies = ["setuptools==80.9.0", "wheel==0.45.1", "colorama==0.4.6"]

[tool.uv.sources]
MicroserviceBase = { git = "https://github.com/test-fullautomation/microservice-base.git", rev = "47d91b5077dc1dc10ffcf65a425b2981c8a70e80" }
microservice-gui-bridge = { path = "bridge" }